[workspace]
resolver = "3"
members = ["."]

[package]
name = "skycache"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bb8 = "0.9"
bytes = "1.11.1"
clap = { version = "4.5.17", features = ["derive", "env"] }
diesel = { version = "2.2.3", default-features = false, features = ["postgres_backend", "uuid"] }
diesel-async = { version = "0.9.0", features = ["bb8", "postgres"] }
futures = "0.3.30"
http = "1.2.0"
hyper = "1.4.1"
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
miette = { version = "7.2.0", features = ["fancy"] }
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.32.0", features = ["metrics", "rt-tokio"] }
prost = "0.14.3"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.0", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = "1.16.0"

# Bazel's prost toolchain runs these as protoc plugins; nothing links them.
protoc-gen-prost = "0.5.0"
protoc-gen-tonic = "0.5.0"
prost-types = "0.14.3"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio-stream = { version = "0.1.16", features = ["net"] }
wiremock = "0.6"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
